name: Build Flet APK

on:
  workflow_dispatch: 

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Обязательно скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Запускаем сборку (экшен сам настроит Flutter и Java внутри)
      - name: Build Flet APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      # Сохраняем готовый файл
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-android-app
          path: build/apk/*.apk
