name: Build Flet APK

on:
  push:
    branches: [ main, master ] # Сборка будет запускаться при пуше в эти ветки
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build:
    name: Build APK Target
    runs-on: ubuntu-latest

    steps:
      # Step 1: Клонируем ваш репозиторий в CI-окружение
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Устанавливаем Java JDK (необходима для сборки под Android)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Принудительно принимаем лицензии Android SDK
      # Это решает проблему "[!] Some Android licenses not accepted" из вашего лога
      - name: Accept Android Licenses
        run: |
          yes | source /usr/local/lib/android/sdk/tools/bin/sdkmanager --licenses || true

      # Step 4: Используем официальный экшен для сборки Flet-приложений
      # Он сам установит нужную версию Flutter, Python и соберет APK
      - name: Build Flet Android App
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      # Step 5: Сохраняем собранный APK в артефакты GitHub Actions
      # После окончания сборки файл можно будет скачать прямо со страницы Actions
      - name: Upload APK Artifact
        uses: actions/artifacts@v4
        with:
          name: flet-app-release-apk
          path: build/apk/*.apk
