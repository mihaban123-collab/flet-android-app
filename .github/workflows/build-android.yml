name: Build Flet APK

on:
  workflow_dispatch: 

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Скачиваем код вашего репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Шаг 3: Устанавливаем Java 17, необходимую для Android-сборщика
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Шаг 4: Устанавливаем сам Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Шаг 5: Устанавливаем Flet и запускаем сборку напрямую командами
      - name: Install Flet and Build APK
        run: |
          pip install flet==1.0.0
          flet build apk --yes

      # Шаг 6: Сохраняем и выводим готовый файл
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-android-app
          path: build/apk/*.apk
